[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instron_analysis"
version = "0.2.0"
description = "A modular tool for parsing, analyzing, and plotting Instron tensile testing session data."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Zach Kaye", email = "zachary.kaye@tomtex.com"},
]
keywords = ["instron", "materials-science", "tensile-testing", "stress-strain", "mechanics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

# Core dependencies required for default execution
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
]

# Optional extensions (MARS modeling and development tools)
[project.optional-dependencies]
mars = ["scikit-contrib-py-earth"]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

# Instruct setuptools to discover package modules inside src/
[tool.setuptools.packages.find]
where = ["src"]